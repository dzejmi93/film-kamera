plugins {
    id 'com.android.application'
}

android {
    namespace 'rs.filmkamera'
    compileSdk 34

    defaultConfig {
        applicationId 'rs.filmkamera'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        shared {
            storeFile file('filmkamera.keystore')
            storePassword 'filmkamera'
            keyAlias 'filmkamera'
            keyPassword 'filmkamera'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
