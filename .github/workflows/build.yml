name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Kadar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kadar
          path: Kadar.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          printf '%s\n' \
            "**Kadar ${VERSION}** — free film camera for Android." "" \
            "1. Download **Kadar.apk** below on your phone." \
            "2. Open it and allow installing from this source if Android asks." \
            "3. If Play Protect warns, tap *More details → Install anyway*." "" \
            "To update, install the new APK over the old one. Your roll stays." "" \
            "Built from commit ${GITHUB_SHA::7}." > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Kadar.apk --title "Kadar ${VERSION}" --notes-file notes.md
